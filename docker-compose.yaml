services:
  postgres:
    container_name: postgres
    image: postgres:14
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis:/data
    command: redis-server --appendonly yes

  node:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://admin:root@postgres:5432/myapp?schema=public
      JWT_SECRET: mysecret
      JWT_EXPIRES_IN: 1h
      PORT: 3000
      NODE_ENV: development
      HASH_SALT: 24
      SESSION_SECRET: mysecretsession
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGHOST: postgres
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_DEFAULT_DB: postgres
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker_pgadmin.json:/pgadmin4/servers.json

volumes:
  postgres-data:
  pgadmin-data:
